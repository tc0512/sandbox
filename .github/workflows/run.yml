name: Run Code

on:
  push:
  workflow_dispatch:

jobs:
  run-code:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Install Dependencies
        run: pip install sympy matplotlib rich
        
      - name: Run Code
        run: time python 202608302051.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: matplotlib-picture
          path: ./*.png
