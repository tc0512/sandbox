name: Solve Equation System With Sympy

on:
  push:
  workflow_dispatch:

jobs:
  run-code:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Install Sympy
        run: pip install sympy
        
      - name: Solve Equation System
        run: python thunder8.py
